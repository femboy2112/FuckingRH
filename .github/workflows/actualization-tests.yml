name: Field-relative actualization verification

on:
  push:
    branches:
      - 'build/2026-10-09/field-relative-actualization-a1'
      - 'research/2026-10-10/yoneda-resource-actualization-v1'
      - 'aletheia/gamma-actualization-interferometer-2026-10-10'
      - 'aletheia/infinite-realization-ind-yoneda-2026-10-10'
      - 'aletheia/gamma-succ-prime-transport-2026-10-10'
      - 'aletheia/succ-shadow-gamma-selection-2026-10-10'
      - 'aletheia/lambert-w-succ-inverse-tree-2026-10-10'
      - 'aletheia/dirichlet-star-lambert-source-2026-10-10'
      - 'aletheia/finite-succ-hasse-theta-seam-2026-10-10'
      - 'aletheia/balanced-theta-li-window-2026-10-10'
      - 'aletheia/omega-succ-second-order-report-2026-10-10'
      - 'aletheia/observational-succ-godel-2026-10-10'
    paths:
      - 'actualization/**'
      - 'tests/actualization/**'
      - 'research/2026-10-10/GAMMA_ACTUALIZATION_INTERFEROMETER.md'
      - 'research/2026-10-10/INFINITE_REALIZATION_LIMITS.md'
      - 'research/2026-10-10/SUCC_GAMMA_PRIME_PATH_GERMS.md'
      - 'research/2026-10-10/SUCC_SHADOW_WINDOW_CANONICAL_SELECTION.md'
      - 'research/2026-10-10/LAMBERT_SUCC_INVERSE_TREE.md'
      - 'research/2026-10-10/DIRICHLET_LAMBERT_SOURCE_LIFT.md'
      - 'research/2026-10-10/FINITE_SUCC_HASSE_THETA_SEAM.md'
      - 'research/2026-10-10/BALANCED_THETA_LI_WINDOW.md'
      - 'research/2026-10-10/OMEGA_SUCC_SECOND_ORDER_WEIL_REPORT.md'
      - 'scripts/infinite_realization_demo.py'
      - 'scripts/gamma_succ_path_probe.py'
      - 'scripts/lambert_succ_probe.py'
      - 'scripts/dirichlet_lambert_probe.py'
      - 'scripts/hasse_theta_seam_probe.py'
      - 'scripts/balanced_theta_li_probe.py'
      - 'scripts/ordinal_succ_report_probe.py'
      - 'scripts/audit_actualization.py'
      - 'scripts/mutate_actualization.py'
      - '.github/workflows/actualization-tests.yml'
  pull_request:
    paths:
      - 'actualization/**'
      - 'tests/actualization/**'
      - 'research/2026-10-10/GAMMA_ACTUALIZATION_INTERFEROMETER.md'
      - 'research/2026-10-10/INFINITE_REALIZATION_LIMITS.md'
      - 'research/2026-10-10/SUCC_GAMMA_PRIME_PATH_GERMS.md'
      - 'research/2026-10-10/SUCC_SHADOW_WINDOW_CANONICAL_SELECTION.md'
      - 'research/2026-10-10/LAMBERT_SUCC_INVERSE_TREE.md'
      - 'research/2026-10-10/DIRICHLET_LAMBERT_SOURCE_LIFT.md'
      - 'research/2026-10-10/FINITE_SUCC_HASSE_THETA_SEAM.md'
      - 'research/2026-10-10/BALANCED_THETA_LI_WINDOW.md'
      - 'research/2026-10-10/OMEGA_SUCC_SECOND_ORDER_WEIL_REPORT.md'
      - 'scripts/infinite_realization_demo.py'
      - 'scripts/gamma_succ_path_probe.py'
      - 'scripts/lambert_succ_probe.py'
      - 'scripts/dirichlet_lambert_probe.py'
      - 'scripts/hasse_theta_seam_probe.py'
      - 'scripts/balanced_theta_li_probe.py'
      - 'scripts/ordinal_succ_report_probe.py'
      - 'scripts/audit_actualization.py'
      - 'scripts/mutate_actualization.py'
      - '.github/workflows/actualization-tests.yml'

permissions:
  contents: read

jobs:
  finite-system:
    name: Python ${{ matrix.python }} finite mechanics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install mpmath for Suzuki comparison
        run: python -m pip install mpmath
      - name: Run Gamma/finite-place correlated response tests
        run: python -m unittest discover -s tests/actualization -p 'test_gamma_interferometer.py' -v
      - name: Run infinite-realization, pi/e and delayed-source controls
        run: python -m unittest discover -s tests/actualization -p 'test_infinite_realization.py' -v
      - name: Reproduce exact infinite Ind-object finite evidence
        run: |
          python scripts/infinite_realization_demo.py --stage 12 --terms 12 --output "$RUNNER_TEMP/infinite-realization.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          evidence=json.loads((Path(os.environ['RUNNER_TEMP'])/'infinite-realization.json').read_text())
          assert evidence['status']=='FINITE_EXACT_DEMONSTRATION'
          assert evidence['finite_negative_Q_stage_e_stage']=='-1'
          assert evidence['finite_negative_Q_stage_plus_one_e_stage']=='1'
          assert evidence['persistent_negative_control']=='-1'
          assert evidence['ind_limit']['represented_by_finite_integer'] is False
          print('Finite Ind-Yoneda evidence verified; no infinity/RH claim')
          PY
      - name: Test SUCC/Gamma finite factorial and prime-path germs
        run: python -m unittest discover -s tests/actualization -p 'test_gamma_succ_path.py' -v
      - name: Save independent prime/gamma transport readouts
        run: |
          python scripts/gamma_succ_path_probe.py --prime-bound 53 --gamma-steps 64 --output "$RUNNER_TEMP/gamma-succ-prime-path.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'gamma-succ-prime-path.json').read_text())
          assert j['status']=='FINITE_PATH_PROBE'
          assert j['m_equals_one_scalar_ratio']=='1'
          assert j['counterfeit_composite_6_scalar_ratio']=='1'
          assert j['counterfeit_composite_6_is_true_zeta_source'] is False
          assert j['gamma_factorial_exact_prime_bridge']
          print('Prime/Gamma finite transport evidence recorded; no RH claim')
          PY
      - name: Test SUCC-shadow Gamma uniqueness windows and winding gluing
        run: python -m unittest discover -s tests/actualization -p 'test_succ_shadow_window.py' -v
      - name: Test Lambert-W SUCC inverse rank and rooted-tree analytic branch
        run: python -m unittest discover -s tests/actualization -p 'test_lambert_succ.py' -v
      - name: Reproduce exact factorial rank, tree coefficients and W branch evidence
        run: |
          python scripts/lambert_succ_probe.py --factorial-stage 32 --tree-stage 40 --output "$RUNNER_TEMP/lambert-succ.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ['RUNNER_TEMP'])/'lambert-succ.json').read_text())
          assert j["status"]=="FINITE_ZERO_FREE_LAMBERT_SUCC_PROBE"
          assert j["factorial_inverse_exact_witness"]["rank"]==32
          assert j["tree_succ"]["tree_functional_residual_at_true_stage"]=="0"
          assert j["tree_succ"]["tree_mutation_at_six"]=="1/10"
          assert j["arithmetic_mutation_negative_control"]["connected_true_at_6"]=="0"
          assert j["arithmetic_mutation_negative_control"]["connected_fake_at_6"]=="1"
          assert j["arithmetic_mutation_negative_control"]["W_factorial_inverse_unchanged"]
          print("Lambert SUCC exact source/branch evidence verified; no RH theorem")
          PY
      - name: Test source-faithful Dirichlet-convolution Lambert W and fake arithmetic
        run: python -m unittest discover -s tests/actualization -p 'test_dirichlet_lambert.py' -v
      - name: Save arithmetic Lambert-W exact prime-path and safe Mellin evidence
        run: |
          python scripts/dirichlet_lambert_probe.py --horizon 64 --sigma 4 --output "$RUNNER_TEMP/dirichlet-lambert.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'dirichlet-lambert.json'
          j=json.loads(p.read_text())
          assert j['status']=='EXACT_ARITHMETIC_LAMBERT_PREFIX'
          assert j['true_source']['w6']=='-1'
          assert j['true_source']['connected_b6']=='0'
          assert j['fake_source']['w6']=='0'
          assert j['fake_source']['connected_b6']=='1'
          assert j['true_inverse_identity'] and j['fake_inverse_identity']
          assert j['zeros_read'] is False
          print('Arithmetic Lambert-W source and Euler-shadow controls passed')
          PY
      - name: Test finite SUCC-Hasse continuation and source-faithful theta/Gamma seam
        run: python -m unittest discover -s tests/actualization -p 'test_hasse_theta_seam.py' -v
      - name: Replay SUCC-Hasse and theta prime-Gamma cancellation evidence
        run: |
          python scripts/hasse_theta_seam_probe.py --output "$RUNNER_TEMP/hasse-theta-seam.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path(os.environ['RUNNER_TEMP'])/'hasse-theta-seam.json'
          j=json.loads(f.read_text())
          assert j['status']=='FINITE_SUCC_HASSE_THETA_SEAM_REPLAY'
          assert j['exact_negative_zeta_values']['-1']['zeta']=='-1/12'
          assert j['exact_negative_zeta_values']['-2']['zeta']=='0'
          assert j['trivial_zero_gamma_pole_jets']['-2']['positive_current_from_gamma_subtracted_jets']
          assert j['sources']['fake_primitive_2_seam']['3']=='1'
          assert j['riemann_siegel_square_root_window']['spectral_t_200_fake_visibility'] is False
          assert j['riemann_siegel_square_root_window']['spectral_t_250_fake_visibility'] is True
          assert j['source_seam_negative_control_at_s_2']['forced_symmetry_is_NOT_source_completion']
          assert j['nontrivial_zero_locations_or_ordinates_used'] is False
          print('Finite SUCC/archimedean seam controls PASS; RH remains open')
          PY
      - name: Test coupled theta source horizons and zero-free finite Li jets
        run: python -m unittest discover -s tests/actualization -p 'test_balanced_theta_li.py' -v
      - name: Reproduce joint theta horizon and fixed-degree Li source evidence
        run: |
          python scripts/balanced_theta_li_probe.py --output "$RUNNER_TEMP/balanced-theta-li.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"balanced-theta-li.json").read_text())
          assert j["status"]=="ZERO_BLIND_BALANCED_THETA_AND_LI_PROBE"
          assert j["matched_horizon"]["fake_at_mirror_fixed_u_0"]=="0.0"
          assert j["finite_collision"]["finite_N_4_T_0_325_positive_Li_first_degree_count"]==12
          assert j["finite_Li"]["all_degree_uniform_positivity"] is False
          assert j["degree_coevolution"]["both_errors_below_2_to_minus_index"] is True
          assert j["degree_coevolution"]["RH_sign_proved"] is False
          assert j["nontrivial_zeta_zeros_used_as_source"] is False
          print("Balanced theta / Li source and negative controls reproduced")
          PY
      - name: Test ordinal SUCC observation reports and mixed-second Weil correlation
        run: python -m unittest discover -s tests/actualization -p 'test_ordinal_succ_report.py' -v
      - name: Test Godel Pi1 finite witness and adversarial delay semantics
        run: python -m unittest discover -s tests/actualization -p 'test_godel_succ.py' -v
      - name: Emit bounded Godel observational-SUCC demo
        run: python -m actualization.godel_succ
      - name: Reproduce ordinal omega+1 semantic, Weil and Hilbert escape evidence
        run: |
          python scripts/ordinal_succ_report_probe.py --output "$RUNNER_TEMP/ordinal-succ-report.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          j=json.loads((Path(os.environ["RUNNER_TEMP"])/"ordinal-succ-report.json").read_text())
          assert j["status"]=="FINITE_ORDINAL_SUCC_SECOND_ORDER_WEIL_PROBE"
          assert j["formal_ordinals"]["global_PSD_predicate_proved"] is False
          assert j["connected_source_second_order"]["fake_connected_curvature"]=="1"
          assert j["connected_source_second_order"]["true_connected_curvature"]=="0"
          assert j["positive_observations_are_not_positive_correlations"]["quartic_determinant"]=="-192"
          assert j["positive_observations_are_not_positive_correlations"]["quartic_quadratic_vector_ones"]=="-24"
          assert j["semantic_second_derivative_information_geometry"]["both_information_geometries_PSD"]
          assert j["semantic_second_derivative_information_geometry"]["Weil_identification_established"] is False
          assert j["hilbert_critical_line_observer_escape"]["weak_limit_zero_not_strong"]
          assert j["hilbert_critical_line_observer_escape"]["normalizable_omega_vector_exists"] is False
          assert j["no_actual_infinite_ordinal_computed"]
          assert j["no_RH_or_Weil_positive_sign_assumed"]
          print("Finite ordinal SUCC, semantic Hessian and Hilbert weak escape controls PASS")
          PY
      - name: Run seven isolated regression lanes
        run: python scripts/audit_actualization.py --output "$RUNNER_TEMP/actualization-audit"
      - name: Run fifteen hostile mutations
        run: python scripts/mutate_actualization.py --output "$RUNNER_TEMP/actualization-mutations"
      - name: Check complete history demo and replay
        shell: bash
        run: |
          python -m actualization demo --output "$RUNNER_TEMP/demo.json" --trace "$RUNNER_TEMP/trace.json"
          python -m actualization replay "$RUNNER_TEMP/trace.json" --output "$RUNNER_TEMP/replayed.json"
          python -m actualization reverse "$RUNNER_TEMP/trace.json" --output "$RUNNER_TEMP/reversed.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          assert json.loads((root/'replayed.json').read_text())['verified']
          trace=json.loads((root/'trace.json').read_text())
          reversed_trace=json.loads((root/'reversed.json').read_text())
          assert len(reversed_trace['records'])==2*len(trace['records'])
          print('CLI history replay and non-erasing reversal PASS')
          PY
      - name: Retain raw lane outputs and execution manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actualization-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/actualization-audit/
            ${{ runner.temp }}/actualization-mutations/
            ${{ runner.temp }}/demo.json
            ${{ runner.temp }}/trace.json
            ${{ runner.temp }}/replayed.json
            ${{ runner.temp }}/reversed.json
            ${{ runner.temp }}/infinite-realization.json
            ${{ runner.temp }}/gamma-succ-prime-path.json
            ${{ runner.temp }}/lambert-succ.json
            ${{ runner.temp }}/dirichlet-lambert.json
            ${{ runner.temp }}/hasse-theta-seam.json
            ${{ runner.temp }}/balanced-theta-li.json
            ${{ runner.temp }}/ordinal-succ-report.json
          if-no-files-found: warn
          retention-days: 14
